name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version in X.Y.Z format (without v)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Create release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Validate release request
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow from main."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the X.Y.Z format without a v prefix."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Check existing release state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          branch="release/v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"; then
            echo "Tag 'v$VERSION' already exists."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$branch"; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            branch_version=$(git show "origin/$branch:app/pyproject.toml" | python -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])')
            source_version=$(git show "origin/$branch:app/src/ledsetup/__init__.py" | sed -n 's/^__version__ = "\([^"]*\)"$/\1/p')
            if [[ "$branch_version" != "$VERSION" || "$source_version" != "$VERSION" ]]; then
              echo "Release branch '$branch' exists but does not contain version $VERSION; refusing to overwrite it."
              exit 1
            fi
            open_prs=$(gh pr list --base main --head "$branch" --state open --json number --jq 'length')
            if [[ "$open_prs" == "0" ]]; then
              gh pr create --base main --head "$branch" \
                --title "chore(release): v$VERSION" \
                --body "Prepares v$VERSION. Merge this pull request, then create tag v$VERSION on main."
            fi
            gh workflow run ci.yml --ref "$branch"
            exit 0
          fi
      - name: Update release metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          import os
          import re
          import tomllib

          version = os.environ["VERSION"]
          pyproject_path = Path("app/pyproject.toml")
          pyproject = pyproject_path.read_text(encoding="utf-8")
          current_version = tomllib.loads(pyproject)["project"]["version"]
          if current_version == version:
              raise SystemExit(f"Version {version} is already set in pyproject.toml.")
          pyproject, replacements = re.subn(
              r'(?m)^version = "[^"]+"$', f'version = "{version}"', pyproject, count=1
          )
          if replacements != 1:
              raise SystemExit("Could not update project.version in pyproject.toml.")
          pyproject_path.write_text(pyproject, encoding="utf-8")

          package_path = Path("app/src/ledsetup/__init__.py")
          package = package_path.read_text(encoding="utf-8")
          source_version = re.search(r'(?m)^__version__ = "([^"]+)"$', package)
          if source_version is None or source_version.group(1) != current_version:
              raise SystemExit("pyproject.toml and ledsetup.__version__ must match before release preparation.")
          package, replacements = re.subn(
              r'(?m)^__version__ = "[^"]+"$', f'__version__ = "{version}"', package, count=1
          )
          if replacements != 1:
              raise SystemExit("Could not update ledsetup.__version__.")
          package_path.write_text(package, encoding="utf-8")

          empty_unreleased = "\n".join(
              ["## [Unreleased]", "", "### Added", "", "### Changed", "", "### Deprecated", "", "### Removed", "", "### Fixed", "", "### Security", ""]
          )

          def prepare_changelog(path: Path, fallback_note: str) -> None:
              changelog = path.read_text(encoding="utf-8")
              match = re.search(r'(?ms)^## \[Unreleased\]\n(.*?)(?=^## \[|\Z)', changelog)
              if match is None:
                  raise SystemExit(f"{path} must contain a ## [Unreleased] section.")
              unreleased = match.group(1).strip()
              release_notes = unreleased if unreleased else fallback_note
              release_section = f"## [{version}] - {date.today().isoformat()}\n\n{release_notes}\n\n"
              updated = changelog[: match.start()] + empty_unreleased + "\n" + release_section + changelog[match.end() :]
              path.write_text(updated, encoding="utf-8")

          prepare_changelog(Path("CHANGELOG.md"), "### Changed\n\n- Подготовка релиза.")
          prepare_changelog(Path("CHANGELOG.en.md"), "### Changed\n\n- Release preparation.")
          PY
      - name: Create release branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add CHANGELOG.md CHANGELOG.en.md app/pyproject.toml app/src/ledsetup/__init__.py
          git commit -m "chore(release): v$VERSION"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(release): v$VERSION" \
            --body "Prepares v$VERSION. Merge this pull request, then create tag v$VERSION on main."
          gh workflow run ci.yml --ref "$branch"

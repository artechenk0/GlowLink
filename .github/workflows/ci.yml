name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Test and publish coverage summary
        run: >
          python -m pytest --cov=ledsetup --cov-report=term-missing
          --cov-report="markdown-append:$env:GITHUB_STEP_SUMMARY"
      - name: Check formatting
        run: python -m ruff format --check src tests
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy src

  package:
    name: Build and install package
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install wheel in a clean environment
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1
          $venvPath = Join-Path $env:RUNNER_TEMP "ledsetup-wheel-test"
          python -m venv $venvPath
          & "$venvPath\Scripts\python.exe" -m pip install $wheel.FullName
          & "$venvPath\Scripts\ledsetup.exe" --help
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ledsetup-dist
          path: app/dist/
          if-no-files-found: error
          retention-days: 7

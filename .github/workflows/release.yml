name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag in vX.Y.Z format"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify release (Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag '$env:RELEASE_TAG' must use the vX.Y.Z format."
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Confirm selected tag exists
        shell: pwsh
        run: |
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG^{commit}" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag '$env:RELEASE_TAG' does not exist."
          }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: ./.github/actions/quality
      - name: Check tag matches package version
        shell: pwsh
        working-directory: app
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          $projectVersion = uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($projectVersion -ne $tagVersion) {
            throw "Release tag '$env:RELEASE_TAG' does not match pyproject.toml version '$projectVersion'."
          }

  package:
    name: Build Windows distribution
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install locked dependencies
        run: uv sync --locked --group ci
      - name: Build wheel and source distribution
        run: uv build
      - name: Build Windows executable
        run: >
          uv run --no-sync python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name GlowLink --icon "$env:GITHUB_WORKSPACE/app/src/ledsetup/web/glowlink.ico"
          --paths src --collect-data ledsetup --collect-all webview --collect-all bleak
          --collect-all mss --collect-all winrt --distpath dist --workpath build/pyinstaller
          --specpath build/pyinstaller src/ledsetup/__main__.py
      - name: Install wheel in a clean environment
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1
          $venvPath = Join-Path $env:RUNNER_TEMP "ledsetup-wheel-test"
          python -m venv $venvPath
          & "$venvPath\Scripts\python.exe" -m pip install $wheel.FullName
          & "$venvPath\Scripts\ledsetup.exe" --help
      - name: Check Windows executable starts
        shell: pwsh
        run: |
          $executable = Resolve-Path "dist/GlowLink.exe"
          $process = Start-Process -FilePath $executable -ArgumentList "--help" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "GlowLink.exe exited with code $($process.ExitCode)."
          }
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ledsetup-dist
          path: app/dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ledsetup-dist
          path: dist
      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" dist/* --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" dist/* --repo "$env:GITHUB_REPOSITORY" `
              --generate-notes --title "$env:RELEASE_TAG"
          }

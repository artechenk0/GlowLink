name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag in vX.Y.Z format"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release (Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - name: Check tag matches package version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag '$env:RELEASE_TAG' must use the vX.Y.Z format."
          }
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          $projectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($projectVersion -ne $tagVersion) {
            throw "Release tag '$env:RELEASE_TAG' does not match pyproject.toml version '$projectVersion'."
          }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Test and publish coverage summary
        run: >
          python -m pytest --cov=ledsetup --cov-report=term-missing
          --cov-report="markdown-append:$env:GITHUB_STEP_SUMMARY"
      - name: Check formatting
        run: python -m ruff format --check src tests
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy src

  package:
    name: Build Windows distribution
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install wheel in a clean environment
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1
          $venvPath = Join-Path $env:RUNNER_TEMP "ledsetup-wheel-test"
          python -m venv $venvPath
          & "$venvPath\Scripts\python.exe" -m pip install $wheel.FullName
          & "$venvPath\Scripts\ledsetup.exe" --help
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ledsetup-dist
          path: app/dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: ledsetup-dist
          path: dist
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: >
          gh release create "$env:RELEASE_TAG" dist/* --repo "$env:GITHUB_REPOSITORY"
          --generate-notes --title "$env:RELEASE_TAG"
